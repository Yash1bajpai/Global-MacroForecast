name: Monthly MacroForecast Candidate (no auto-promotion)

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and preprocess (never publish)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/data/fetch_all.py
          python src/data/preprocess.py
      - name: Check data freshness
        run: |
          python - <<'PY'
          import pandas as pd
          for c in ['us', 'india', 'japan', 'germany']:
              df = pd.read_csv(f'data/processed/{c}_master.csv', index_col=0, parse_dates=True)
              assert df.index.max() >= pd.Timestamp.today().to_period('Q').start_time - pd.DateOffset(months=12), c
          PY
      - run: python -m unittest discover -s tests -v
      - name: Train isolated candidates
        run: python -m src.models.train_candidate --output candidate_artifacts
      - name: Preserve candidate reports even when gate rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macroforecast-research-candidate
          path: candidate_artifacts/
      - name: Fail-closed metric gate (no approved causal incumbent yet)
        run: python -m src.models.metric_gate --candidate candidate_artifacts/evaluation.json
      # No git push, deployment export or write permission. Review required.
